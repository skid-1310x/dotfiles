# set -q base-index 1
set -g base-index 1

unbind C-b
set -g prefix C-q

bind S run -b tmux-session-fzf

bind -n M-s split-window -v
bind -n M-v split-window -h

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# resize panes like vim
bind < resize-pane -L 1
bind > resize-pane -R 1
bind - resize-pane -D 1
bind + resize-pane -U 1

# bind : to command-prompt like vim
# this is the default in tmux already
bind : command-prompt
#bind : mode-keys vi

# vi-style controls for copy mode
setw -g mode-keys vi

bind e setw synchronize-panes on
bind E setw synchronize-panes off

bind -n M-Enter new-window
bind -n M-Q kill-pane

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-0 select-window -t :10

## Change current pane to next window
bind M-0 if-shell 'tmux join-pane -t :0' '' 'new-window -d -t 0; join-pane -t :0 ; kill-pane -a'
bind M-1 if-shell 'tmux join-pane -t :1' '' 'new-window -d -t 1; join-pane -t :1 ; kill-pane -a'
bind M-2 if-shell 'tmux join-pane -t :2' '' 'new-window -d -t 2; join-pane -t :2 ; kill-pane -a'
bind M-3 if-shell 'tmux join-pane -t :3' '' 'new-window -d -t 3; join-pane -t :3 ; kill-pane -a'
bind M-4 if-shell 'tmux join-pane -t :4' '' 'new-window -d -t 4; join-pane -t :4 ; kill-pane -a'
bind M-5 if-shell 'tmux join-pane -t :5' '' 'new-window -d -t 5; join-pane -t :5 ; kill-pane -a'
bind M-6 if-shell 'tmux join-pane -t :6' '' 'new-window -d -t 6; join-pane -t :6 ; kill-pane -a'
bind M-7 if-shell 'tmux join-pane -t :7' '' 'new-window -d -t 7; join-pane -t :7 ; kill-pane -a'
bind M-8 if-shell 'tmux join-pane -t :8' '' 'new-window -d -t 8; join-pane -t :8 ; kill-pane -a'
bind M-9 if-shell 'tmux join-pane -t :9' '' 'new-window -d -t 9; join-pane -t :9 ; kill-pane -a'

set -g mouse on
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

set -s escape-time 0

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

set-option -g history-limit 100000
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

set-option -g status-left " |"
set-option -g status-right-length 70
set-option -g status-right "#S | %Y/%m/%d(%a) %H:%M #[default]"

set -g status-style 'bg=colour234,fg=colour188'

set-window-option -g window-status-format " #I |"
set-window-option -g window-status-current-format "#[fg=colour255,bg=colour27] #I #[default]|"
set-window-option -g window-status-separator ""

set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour255

set -g focus-events on
